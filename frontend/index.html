<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мудрый Мухомор</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #output-area::-webkit-scrollbar, .preview-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
        #output-area::-webkit-scrollbar-thumb, .preview-scroll::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 10px; }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-animation { animation: messageSlideIn 0.25s ease-out forwards; }

        .spinner {
            border: 2px solid rgba(167, 139, 250, 0.1);
            width: 20px; height: 20px; border-radius: 50%;
            border-left-color: #a78bfa; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Анимация звёзд */
        .star { transition: transform 0.2s, color 0.2s; cursor: pointer; color: #4b5563; }
        .star:hover { transform: scale(1.3); }
        .star.active { color: #fbbf24; }

        .auth-card { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; scale: 0.95; } to { opacity: 1; scale: 1; } }
    </style>
</head>
<body class="bg-[#0f172a] h-screen flex flex-col items-center justify-center p-2 sm:p-4 font-sans text-gray-200">

    <div id="auth-overlay" class="hidden fixed inset-0 z-[100] bg-[#0f172a]/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="login-form" class="auth-card bg-[#1e293b] border border-gray-700 p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-violet-400">Вход</h2>
            <div class="space-y-4">
                <input type="email" placeholder="Email" class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-violet-500 outline-none transition-colors">
                <input type="password" placeholder="Пароль" class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-violet-500 outline-none transition-colors">
                <button class="w-full bg-violet-600 hover:bg-violet-500 py-3 rounded-lg font-bold transition-all">Войти</button>
            </div>
            <div class="mt-6 text-sm text-center space-y-3 text-gray-400">
                <p>Нет аккаунта? <a href="#" onclick="switchAuth('register')" class="text-violet-400 hover:underline">Создать</a></p>
                <p><a href="#" onclick="switchAuth('recovery')" class="text-gray-400 hover:text-gray-400 transition">Забыли пароль?</a></p>
                <button onclick="closeAuth()" class="text-[10px] uppercase tracking-widest pt-2">Закрыть</button>
            </div>
        </div>

        <div id="register-form" class="hidden auth-card bg-[#1e293b] border border-gray-700 p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-emerald-400">Регистрация</h2>
            <div class="space-y-4">
                <input type="text" placeholder="Имя" class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-emerald-500 outline-none">
                <input type="email" placeholder="Email" class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-emerald-500 outline-none">
                <input type="password" placeholder="Пароль" class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-emerald-500 outline-none">
                <button class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-lg font-bold transition-all">Зарегистрироваться</button>
            </div>
            <div class="mt-6 text-sm text-center text-gray-400">
                <p>Уже с нами? <a href="#" onclick="switchAuth('login')" class="text-emerald-400 hover:underline">Войти</a></p>
            </div>
        </div>

        <div id="recovery-form" class="hidden auth-card bg-[#1e293b] border border-gray-700 p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <h2 class="text-2xl font-bold mb-2 text-center text-amber-400">Восстановление</h2>
            <div class="space-y-4 mt-6">
                <input type="email" placeholder="Email" class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-amber-500 outline-none">
                <button class="w-full bg-amber-600 hover:bg-amber-500 py-3 rounded-lg font-bold transition-all">Сбросить пароль</button>
            </div>
            <div class="mt-6 text-sm text-center">
                <a href="#" onclick="switchAuth('login')" class="text-gray-400 hover:text-white transition">← Назад</a>
            </div>
        </div>
    </div>

    <div class="w-full max-w-2xl bg-[#1e293b] rounded-xl shadow-2xl flex flex-col h-[85vh] border border-gray-700 overflow-hidden relative">
        
        <div id="rating-modal" class="hidden absolute inset-0 z-50 bg-[#0f172a]/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-[#1e293b] border border-gray-700 p-6 rounded-2xl shadow-2xl text-center max-w-xs w-full">
                <h3 class="text-lg font-bold mb-4">Оцените ответ</h3>
                <div class="flex justify-center gap-2 mb-6" id="stars-container">
                    <span class="star text-4xl" data-value="1">★</span>
                    <span class="star text-4xl" data-value="2">★</span>
                    <span class="star text-4xl" data-value="3">★</span>
                    <span class="star text-4xl" data-value="4">★</span>
                    <span class="star text-4xl" data-value="5">★</span>
                </div>
                <button id="close-rating" class="text-xs text-gray-500 hover:text-white transition uppercase tracking-widest">Отмена</button>
            </div>
        </div>

        <div class="px-4 py-2 border-b border-gray-700 bg-[#111827] flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-violet-500 rounded-full animate-pulse"></div>
                <span class="font-bold text-sm text-gray-300">Мудрый Мухомор</span>
            </div>
            <button onclick="openAuth()" class="text-[10px] bg-violet-600/20 hover:bg-violet-600/40 text-violet-400 px-3 py-1 rounded border border-violet-500/30 transition-all uppercase tracking-tighter">Войти</button>
        </div>

        <div id="output-area" class="flex-1 p-4 overflow-y-auto space-y-3 bg-transparent">
            <p class="text-[10px] text-gray-300 uppercase tracking-tighter text-center opacity-40">Начало диалога</p>
        </div>

        <div id="image-preview-container" class="hidden px-4 py-2 bg-[#111827] border-t border-gray-700">
            <div id="preview-list" class="flex gap-2 overflow-x-auto preview-scroll pb-1"></div>
            <p id="image-counter" class="text-[9px] text-gray-500 mt-1 uppercase tracking-widest"></p>
        </div>

        <div id="loader" class="hidden px-4 py-2 flex justify-center"><div class="spinner"></div></div>

        <div class="p-3 bg-[#111827] border-t border-gray-700">
            <div class="flex items-end gap-2 bg-[#334155] rounded-lg px-2 py-1.5 border border-gray-600 focus-within:border-violet-500/50 transition-all">
                <label class="cursor-pointer p-1.5 text-gray-400 hover:text-violet-400">
                    <span class="text-xl">📎</span>
                    <input type="file" id="file-input" class="hidden" accept="image/*" multiple>
                </label>
                <textarea id="user-input" rows="1" class="flex-1 bg-transparent border-none text-white placeholder-gray-300 focus:outline-none py-1.5 resize-none max-h-32 text-base" placeholder="Напишите..."></textarea>
                <button id="send-btn" class="bg-violet-600 text-white p-2 rounded-md hover:bg-violet-500 transition-all flex-shrink-0">➤</button>
            </div>
            <button id="rate-btn" class="block w-full text-center text-[10px] text-gray-300 hover:text-gray-400 mt-2 uppercase tracking-widest">Оценить</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
