<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Мудрый Мухомор</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] h-screen flex items-center justify-center p-4 font-sans text-gray-200">
    <div class="bg-[#1e293b] border border-gray-700 p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-violet-400 uppercase tracking-wider">Вход</h2>
        <form id="login-form" class="space-y-4">
            <input id = "email" type="email" placeholder="Электронная почта" required class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-violet-500 outline-none transition-all">
            <input id = "password" type="password" placeholder="Пароль" required class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-violet-500 outline-none transition-all">
            <button type="submit" class="w-full bg-violet-600 hover:bg-violet-500 py-3 rounded-lg font-bold transition-all shadow-lg shadow-violet-900/20">Войти</button>
        </form>
        <div class="mt-6 text-sm text-center text-gray-400">
            <p>Еще не с нами?<a href="register.html" class="text-violet-400 hover:underline">Создать аккаунт</a></p>
            <p class="mt-2"><a href="reset_request.html" class="text-gray-500 hover:text-violet-400 transition-colors">Забыли пароль?</a></p>
        </div>
    </div>
    <script src="/frontend/main.js"></script>
</body>
</html>
