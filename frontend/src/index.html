<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мудрый Мухомор</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #output-area::-webkit-scrollbar { width: 4px; }
        #output-area::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 10px; }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-animation { animation: messageSlideIn 0.25s ease-out forwards; }

        .spinner {
            border: 2px solid rgba(167, 139, 250, 0.1);
            width: 20px; height: 20px; border-radius: 50%;
            border-left-color: #a78bfa; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-[#0f172a] h-screen flex flex-col items-center justify-center p-2 sm:p-4 font-sans text-gray-200">

    <div class="w-full max-w-2xl bg-[#1e293b] rounded-xl shadow-2xl flex flex-col h-[85vh] border border-gray-700 overflow-hidden">
        
        <div class="px-4 py-2 border-b border-gray-700 bg-[#111827] flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 bg-violet-500 rounded-full animate-pulse"></div>
                <span class="font-bold text-sm text-gray-300">Мудрый Мухомор</span>
            </div>
        </div>

        <div id="output-area" class="flex-1 p-4 overflow-y-auto space-y-3 bg-transparent">
            <p class="text-[10px] text-gray-600 uppercase tracking-tighter text-center opacity-40">Начало диалога</p>
        </div>

        <div id="image-preview-container" class="hidden px-4 py-2 bg-[#111827] flex items-center border-t border-gray-700">
            <div class="relative">
                <img id="image-preview" src="#" class="h-12 w-12 object-cover rounded border border-gray-600">
                <button id="remove-img" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center shadow-xl">×</button>
            </div>
        </div>

        <div id="loader" class="hidden px-4 py-2 flex justify-center">
            <div class="spinner"></div>
        </div>

        <div class="p-3 bg-[#111827] border-t border-gray-700">
            <div class="flex items-end gap-2 bg-[#334155] rounded-lg px-2 py-1.5 border border-gray-600 focus-within:border-violet-500/50 transition-all">
                
                <label class="cursor-pointer p-1.5 text-gray-400 hover:text-violet-400">
                    <span class="text-xl">📎</span>
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                </label>

                <textarea id="user-input" rows="1" 
                    class="flex-1 bg-transparent border-none text-white placeholder-gray-500 focus:outline-none py-1.5 resize-none max-h-32 text-base leading-snug" 
                    placeholder="Напишите..."></textarea>
                
                <button id="send-btn" class="bg-violet-600 text-white p-2 rounded-md hover:bg-violet-500 active:scale-90 transition-all flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                    </svg>
                </button>
            </div>
            
            <button id="rate-btn" class="block w-full text-center text-[10px] text-gray-600 hover:text-gray-400 mt-2 uppercase tracking-widest">Оценить</button>
        </div>
    </div>

    <script>
        const sendBtn = document.getElementById('send-btn');
        const input = document.getElementById('user-input');
        const output = document.getElementById('output-area');
        const loader = document.getElementById('loader');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('image-preview-container');
        const previewImg = document.getElementById('image-preview');
        const removeImgBtn = document.getElementById('remove-img');

        let currentImageData = null;

        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    currentImageData = event.target.result;
                    previewImg.src = currentImageData;
                    previewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        };

        removeImgBtn.onclick = () => {
            currentImageData = null;
            fileInput.value = '';
            previewContainer.classList.add('hidden');
        };

        function addMessage(text, isUser = false, image = null) {
            const msg = document.createElement('div');
            msg.className = (isUser ? 'flex justify-end' : 'flex justify-start') + ' message-animation w-full';
            
            const bgColor = isUser ? 'bg-violet-600 text-white' : 'bg-[#334155] text-gray-100 border border-gray-600';
            
            let content = '';
            if (image) {
                content += `<img src="${image}" class="max-w-[200px] w-full h-auto rounded mb-2 block border border-white/5 shadow-sm">`;
            }
            if (text) {
                content += `<span class="block text-base leading-tight">${text}</span>`;
            }

            msg.innerHTML = `
                <div class="inline-block px-3 py-2 rounded-xl ${isUser ? 'rounded-tr-none' : 'rounded-tl-none'} ${bgColor} max-w-[70%] shadow-lg">
                    ${content}
                </div>
            `;
            output.appendChild(msg);
            output.scrollTo({ top: output.scrollHeight, behavior: 'smooth' });
        }

        sendBtn.onclick = () => {
            const text = input.value.trim();
            const capturedImage = currentImageData;

            if (!text && !capturedImage) return;

            addMessage(text, true, capturedImage);
            
            input.value = '';
            input.style.height = 'auto';
            removeImgBtn.click();
            
            loader.classList.remove('hidden');
            
            setTimeout(() => {
                loader.classList.add('hidden');
                let replyText = "";
                if (capturedImage && text) {
                    replyText = "Принял файл и текст. Обрабатываю...";
                } else if (capturedImage) {
                    replyText = "Интересное фото. Что подсказать?";
                } else {
                    replyText = "Бла бла бла бла бла";
                }
                addMessage(replyText, false);
            }, 1000);
        };

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendBtn.click();
            }
        });

        document.getElementById('rate-btn').onclick = () => alert("Оценка сохранена!");
    </script>
</body>
</html>
