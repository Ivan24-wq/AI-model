<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Мудрый Мухомор</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] h-screen flex items-center justify-center p-4 font-sans text-gray-200">
    <div class="bg-[#1e293b] border border-gray-700 p-8 rounded-2xl shadow-2xl w-full max-w-md relative">
        
        <a href="/" class="absolute top-6 left-6 text-gray-500 hover:text-emerald-400 transition-colors" title="Назад ко входу">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
            </svg>
        </a>

        <h2 class="text-2xl font-bold mb-6 text-center text-emerald-400 uppercase tracking-wider pt-2">Регистрация</h2>
        
        <form id="register-form" class="space-y-4">
            <input id = "username" type="text" placeholder="Ваше имя" required class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-emerald-500 outline-none transition-all">
            <input id = "email" type="email" placeholder="Email" required class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-emerald-500 outline-none transition-all">
            <input id = "password" type="password" placeholder="Придумайте пароль" required class="w-full bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 focus:border-emerald-500 outline-none transition-all">
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-lg font-bold transition-all shadow-lg shadow-emerald-900/20">Зарегистрироваться</button>
        </form>
    </div>
    <script src="/frontend/main.js"></script>
</body>
</html>
