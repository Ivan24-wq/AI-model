version: '3.9'

services:

  backend:
    build:
      context: ./backend

    container_name: ai_backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - ./baseline_model:/models/baseline_model
      - ./improved_model:/models/improved_model

    environment:
      - MONGO_URL=mongodb://mongo:27017
      - REDIS_HOST=redis
      - REDIS_PORT=6379

    depends_on:
      - mongo
      - redis

  frontend:
    image: nginx:latest

    container_name: frontend_nginx

    ports:
      - "80:80"

    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend

  mongo:
    image: mongo:7

    container_name: mongodb

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7

    container_name: redis_db

    restart: always

    ports:
      - "6379:6379"

volumes:
  mongo_data: